<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotería</title>
</head>
<body>

  <h1>Lotería JS</h1>

  <h2>Prueba de Nivel - JavaScript</h2>

  <form id="form-id">

    <label for="input-id">
      Introduce un número del 1 al 10:
    </label>

    <input
      id="input-id"
      type="number"
      placeholder="Introduce un número"
    >

    <button
      id="button-id"
      type="submit"
    >
      Jugar
    </button>

  </form>

  <p id="result-id"></p>
  <p id="message-id"></p>

  <p id="history-id">

  </p>


  <script type ="module" src="./main.js"></script>
  
</body>
</html>
